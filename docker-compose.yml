services:
  postgres:
    image: postgres:17
    container_name: trx-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: trx
      POSTGRES_USER: trx
      POSTGRES_PASSWORD: trx

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trx -d trx"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
